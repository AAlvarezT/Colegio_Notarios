<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor ODE — Acceso</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
    }
    .logo {
      text-align: center;
      margin-bottom: 1.75rem;
    }
    .logo h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #1a3a5c;
      line-height: 1.3;
    }
    .logo p {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 0.25rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 0.35rem;
    }
    input[type=text], input[type=password] {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1.5px solid #d1d5db;
      border-radius: 7px;
      font-size: 1rem;
      transition: border-color 0.18s;
      outline: none;
    }
    input[type=text]:focus, input[type=password]:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }
    .field { margin-bottom: 1.1rem; }
    button[type=submit] {
      width: 100%;
      padding: 0.75rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.18s;
    }
    button[type=submit]:hover { background: #1d4ed8; }
    button[type=submit]:disabled { background: #93c5fd; cursor: not-allowed; }
    #error-msg {
      display: none;
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fca5a5;
      border-radius: 7px;
      padding: 0.6rem 0.85rem;
      font-size: 0.88rem;
      margin-top: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>Conversor de cobranzas ODE</h1>
      <p>Notaría Sofía Ode</p>
    </div>
    <form id="login-form" autocomplete="off">
      <div class="field">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" required autocomplete="username" autofocus>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" id="btn-login">Ingresar</button>
    </form>
    <div id="error-msg"></div>
  </div>
  <script>
    const form = document.getElementById('login-form');
    const btn = document.getElementById('btn-login');
    const errDiv = document.getElementById('error-msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errDiv.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Verificando...';

      const fd = new FormData(form);
      try {
        const res = await fetch('/login', { method: 'POST', body: fd });
        if (res.ok) {
          window.location.href = '/';
        } else {
          const data = await res.json().catch(() => ({}));
          errDiv.textContent = data.detail || 'Credenciales incorrectas.';
          errDiv.style.display = 'block';
        }
      } catch {
        errDiv.textContent = 'Error de conexión. Intente nuevamente.';
        errDiv.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
